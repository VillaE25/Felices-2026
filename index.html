    if (b) bmarks = JSON.parse(b);
    if (l) lang = l;
    if (d !== null) dark = (d === "1");
  } catch(e) {}
}
function showToast() {
  var t = document.getElementById("toast");
  t.style.opacity = "1";
  clearTimeout(t._x);
  t._x = setTimeout(function() { t.style.opacity = "0"; }, 1400);
}
function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function svgOn(c) {
  var el = document.createElementNS("http://www.w3.org/2000/svg","svg");
  el.setAttribute("width","18"); el.setAttribute("height","18");
  el.setAttribute("viewBox","0 0 24 24");
  el.setAttribute("fill",c); el.setAttribute("stroke",c);
  el.setAttribute("stroke-width","2");
  var path = document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d","M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z");
  el.appendChild(path);
  return el.outerHTML;
}
function svgOff() {
  var s = dark ? "#444" : "#ccc";
  var el = document.createElementNS("http://www.w3.org/2000/svg","svg");
  el.setAttribute("width","18"); el.setAttribute("height","18");
  el.setAttribute("viewBox","0 0 24 24");
  el.setAttribute("fill","none"); el.setAttribute("stroke",s);
  el.setAttribute("stroke-width","2");
  var path = document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d","M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z");
  el.appendChild(path);
  return el.outerHTML;
}
function setDay(i) { curDay = i; openKey = null; draw(); }
function toggleMode() { showBM = !showBM; openKey = null; draw(); }
function toggleLang() { lang = (lang === "es") ? "en" : "es"; saveLS(); draw(); }
function toggleTheme() { dark = !dark; saveLS(); draw(); }
function toggleItem(k) { openKey = (openKey === k) ? null : k; draw(); }
function toggleBmark(k) { bmarks[k] = !bmarks[k]; saveLS(); showToast(); draw(); }
function saveNote(k) {
  var el = document.getElementById("note_" + k);
  if (el) { notes[k] = el.value; saveLS(); showToast(); }
}

function makeItem(item, k, c, L) {
  if (item.s) {
    var sdiv = document.createElement("div");
    sdiv.className = "item";
    sdiv.style.opacity = "0.6";
    var srow = document.createElement("div");
    srow.className = "irow";
    srow.style.cursor = "default";
    var stm = document.createElement("span");
    stm.className = "itm";
    stm.style.color = c;
    stm.textContent = item.t;
    var sbd = document.createElement("div");
    sbd.className = "ibd";
    var sti = document.createElement("p");
    sti.className = "iti";
    sti.style.fontStyle = "italic";
    sti.textContent = item.ti;
    sbd.appendChild(sti);
    srow.appendChild(stm);
    srow.appendChild(sbd);
    sdiv.appendChild(srow);
    return sdiv;
  }
  var io = (openKey === k);
  var hb = !!bmarks[k];
  var hn = !!(notes[k] && notes[k].trim());
  var div = document.createElement("div");
  div.className = "item";
  if (io) { div.style.borderColor = c + "44"; div.style.background = dark ? "#1a1a14" : "#fffdf5"; }

  var row = document.createElement("div");
  row.className = "irow";
  row.setAttribute("data-k", k);
  row.onclick = function() { toggleItem(this.getAttribute("data-k")); };

  var tm = document.createElement("span");
  tm.className = "itm";
  tm.style.color = c;
  tm.textContent = item.t;

  var bd = document.createElement("div");
  bd.className = "ibd";

  var ti = document.createElement("p");
  ti.className = "iti" + (item.b ? " bold" : "");
  ti.textContent = item.ti;
  bd.appendChild(ti);

  if (item.de) {
    var de = document.createElement("p");
    de.className = "ide";
    de.textContent = item.de;
    bd.appendChild(de);
  }
  if (hn && !io) {
    var hnp = document.createElement("p");
    hnp.className = "hn";
    hnp.style.color = c;
    hnp.textContent = L.noteSaved;
    bd.appendChild(hnp);
  }

  var bb = document.createElement("button");
  bb.className = "bb";
  bb.setAttribute("data-k", k);
  bb.onclick = function(e) { e.stopPropagation(); toggleBmark(this.getAttribute("data-k")); };
  bb.innerHTML = hb ? svgOn(c) : svgOff();

  row.appendChild(tm);
  row.appendChild(bd);
  row.appendChild(bb);
  div.appendChild(row);

  if (io) {
    var na = document.createElement("div");
    na.className = "na";
    var nl = document.createElement("p");
    nl.className = "nl";
    nl.textContent = L.myNotes;
    var ta = document.createElement("textarea");
    ta.id = "note_" + k;
    ta.placeholder = L.notePH;
    ta.value = notes[k] || "";
    ta.setAttribute("data-k", k);
    ta.oninput = function() { saveNote(this.getAttribute("data-k")); };
    ta.onclick = function(e) { e.stopPropagation(); };
    na.appendChild(nl);
    na.appendChild(ta);
    div.appendChild(na);
  }
  return div;
}

function draw() {
  var L = DATA[lang];
  var c = COLORS[curDay];
  document.body.className = dark ? "dark" : "light";
  document.getElementById("ey").textContent = L.eyebrow;
  document.getElementById("h1").textContent = L.title;
  document.getElementById("su").textContent = L.subtitle;
  document.getElementById("bmBtn").textContent = showBM ? L.prog : L.bm;
  document.getElementById("langBtn").textContent = L.langLbl;
  document.getElementById("themeBtn").textContent = dark ? "\u2600\uFE0F" : "\uD83C\uDF19";
  document.getElementById("toast").textContent = lang === "es" ? "Guardado" : "Saved";

  for (var i = 0; i < 3; i++) {
    var tab = document.getElementById("t" + i);
    tab.textContent = L.days[i];
    tab.style.display = showBM ? "none" : "";
    if (!showBM && i === curDay) {
      tab.style.background = COLORS[i]; tab.style.borderColor = COLORS[i];
      tab.style.color = "#0f0e0a"; tab.style.fontWeight = "bold";
    } else {
      tab.style.background = "transparent";
      tab.style.borderColor = dark ? "#2a2a22" : "#d0c8b8";
      tab.style.color = dark ? "#777" : "#999";
      tab.style.fontWeight = "normal";
    }
  }

  var main = document.getElementById("main");
  main.innerHTML = "";

  if (showBM) { drawBM(L, main); return; }

  var p = L.program[curDay];

  var tbox = document.createElement("div");
  tbox.className = "tbox";
  tbox.style.background = dark ? (c + "18") : "#eeebe3";
  tbox.style.border = dark ? ("1px solid " + c + "33") : "1px solid #d0c8b8";
  if (!dark) { tbox.style.color = "#1a1a14"; }
  tbox.innerHTML = "<p class='tlb' style='color:" + c + "'>" + esc(L.baseText) + "</p><p class='ttx'>" + esc(p.theme) + "</p><p class='tvs'>- " + esc(p.verse) + "</p>";
  main.appendChild(tbox);

  [[L.morning, p.morning, 0], [L.afternoon, p.afternoon, 1]].forEach(function(row) {
    var sname = row[0], items = row[1], si = row[2];
    var sb = document.createElement("div");
    sb.className = "sb";

    var sh = document.createElement("div");
    sh.className = "sh";
    sh.innerHTML = "<div class='sl' style='background:linear-gradient(to right," + c + "44,transparent)'></div><span class='sn' style='color:" + c + "'>" + esc(sname) + "</span><div class='sl' style='background:linear-gradient(to left," + c + "44,transparent)'></div>";
    sb.appendChild(sh);

    items.forEach(function(item, ii) {
      var k = lang + "_" + curDay + "_" + si + "_" + ii;
      sb.appendChild(makeItem(item, k, c, L));
    });
    main.appendChild(sb);
  });

  var rfx = document.createElement("div");
  rfx.className = "rfx";
  var rt = document.createElement("p");
  rt.className = "rt";
  rt.textContent = L.refl + " " + L.days[curDay];
  rfx.appendChild(rt);

  L.prompts.forEach(function(pr, pi) {
    var rk = lang + "_r" + curDay + "_" + pi;
    var ri = document.createElement("div");
    ri.className = "ri";
    var rq = document.createElement("p");
    rq.className = "rq";
    rq.textContent = pr;
    var ta = document.createElement("textarea");
    ta.style.minHeight = "54px";
    ta.style.caretColor = c;
    ta.placeholder = L.writePH;
    ta.value = notes[rk] || "";
    ta.setAttribute("data-k", rk);
    ta.oninput = function() { saveNote(this.getAttribute("data-k")); };
    ri.appendChild(rq);
    ri.appendChild(ta);
    rfx.appendChild(ri);
  });
  main.appendChild(rfx);
}

function drawBM(L, main) {
  var bttl = document.createElement("p");
  bttl.className = "bttl";
  bttl.textContent = L.bmTitle;
  main.appendChild(bttl);

  var found = false;
  ["es","en"].forEach(function(lg) {
    var LD = DATA[lg];
    [0,1,2].forEach(function(di) {
      var p = LD.program[di];
      [[p.morning,0],[p.afternoon,1]].forEach(function(row) {
        row[0].forEach(function(item, ii) {
          var k = lg + "_" + di + "_" + row[1] + "_" + ii;
          if (bmarks[k]) {
            found = true;
            var dc = COLORS[di];
            var bc = document.createElement("div");
            bc.className = "bc";
            var bcr = document.createElement("div");
            bcr.className = "bcr";
            var left = document.createElement("div");
            var bm = document.createElement("p");
            bm.className = "bm";
            bm.textContent = LD.days[di] + " - " + (row[1] === 0 ? LD.morning : LD.afternoon);
            var bti = document.createElement("p");
            bti.className = "bti";
            bti.textContent = item.ti;
            left.appendChild(bm);
            left.appendChild(bti);
            if (item.de) {
              var bde = document.createElement("p");
              bde.className = "bde";
              bde.textContent = item.de;
              left.appendChild(bde);
            }
            var bb = document.createElement("button");
            bb.className = "bb";
            bb.setAttribute("data-k", k);
            bb.onclick = function(e) { toggleBmark(this.getAttribute("data-k")); };
            bb.innerHTML = svgOn(dc);
            bcr.appendChild(left);
            bcr.appendChild(bb);
            bc.appendChild(bcr);
            var nt = notes[k] || "";
            if (nt) {
              var bno = document.createElement("div");
              bno.className = "bno";
              bno.textContent = nt;
              bc.appendChild(bno);
            }
            main.appendChild(bc);
          }
        });
      });
    });
  });

  if (!found) {
    var em = document.createElement("div");
    em.className = "em";
    em.textContent = L.bmEmpty;
    main.appendChild(em);
  }

  var gt = document.createElement("p");
  gt.className = "gt";
  gt.textContent = L.genTitle;
  main.appendChild(gt);

  var ta = document.createElement("textarea");
  ta.style.minHeight = "140px";
  ta.style.caretColor = "#b8860b";
  ta.placeholder = L.genPH;
  ta.value = notes["gen"] || "";
  ta.setAttribute("data-k","gen");
  ta.oninput = function() { saveNote(this.getAttribute("data-k")); };
  main.appendChild(ta);
}

loadLS();
draw();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').catch(function(e) {
      console.log('SW registration failed:', e);
    });
  });
}
</script>
</body>
</html>
